name: telegram-metadata-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telegram_metadata_test
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:15456:5432"]
    volumes: ["metadata_test_db:/var/lib/postgresql/data"]
volumes:
  metadata_test_db:
